name: build

# Builds both images of this project and keeps them as artifacts for 30 days:
#
#   demo-image    Ubuntu behind the distro's own signed shim and GRUB. Boots
#                 under stock Secure Boot keys with nothing enrolled. Artifacts:
#                 .img + .img.bmap (bmaptool), .iso (installer), .sbom.json
#   verity-image  Ubuntu behind the distro's shim, but with osb's own signed UKI
#                 as the second stage and dm-verity underneath. Needs osb's
#                 certificate enrolled once (MokManager, or mokutil from a live
#                 system); the certificate ships on the ESP. Artifacts: .img +
#                 .img.bmap + .sbom.json
#
# osb comes from its latest release; if there is no release yet it is built from
# source, so this works either way.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: demo-image
            chain: grub
            iso: true
          - image: verity-image
            chain: uki
            iso: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install osb
        run: |
          url=https://github.com/haonguy3n/osb/releases/latest/download/osb-linux-amd64
          if curl -fsSL -o "$RUNNER_TEMP/osb" "$url"; then
            echo "using the latest osb release"
          else
            echo "no osb release available yet - building osb from source"
            git clone --depth 1 https://github.com/haonguy3n/osb.git "$RUNNER_TEMP/osb-src"
            (cd "$RUNNER_TEMP/osb-src" && go build -o "$RUNNER_TEMP/osb" ./cmd/osb)
          fi
          sudo install -m 0755 "$RUNNER_TEMP/osb" /usr/local/bin/osb
          osb version | tee "$RUNNER_TEMP/osb-version.txt"
      - name: Allow unprivileged user namespaces
        # osb builds every unit inside a bwrap sandbox, which needs
        # unprivileged user namespaces: Ubuntu 24.04 denies them by default
        # through AppArmor, and then every unit fails with "setting up uid map:
        # Permission denied".
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          unshare --user --map-root-user true
      - name: Cache key inputs
        id: key
        run: |
          echo "week=$(date +%Y-%V)" >> "$GITHUB_OUTPUT"
          echo "osb=$(tr -d '\n' < "$RUNNER_TEMP/osb-version.txt")" >> "$GITHUB_OUTPUT"
      - name: Cache osb's toolchain image
        # The toolchain image (compiler and distro tooling) is the most expensive
        # part of a from-scratch build. It holds the builder, not the target
        # packages, so a week-old one is fine. Both jobs want the same one.
        id: toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/osb-toolchains.tar.zst
          key: toolchain-${{ runner.arch }}-ubuntu-${{ steps.key.outputs.osb }}-${{ steps.key.outputs.week }}
      - name: Load the toolchain image
        if: steps.toolchain.outputs.cache-hit == 'true'
        run: |
          zstd -dc "$RUNNER_TEMP/osb-toolchains.tar.zst" | docker load \
            || echo "warning: cached toolchain image unusable; rebuilding"
      - name: Build ${{ matrix.image }}
        run: osb build ${{ matrix.image }} -distro ubuntu -machine x86_64
      - name: Save the toolchain image for the cache
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          images=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep '^osb/toolchain' || true)
          [ -n "$images" ] || exit 0
          docker save $images | zstd -T0 -3 > "$RUNNER_TEMP/osb-toolchains.tar.zst"
      - name: Check the artifacts
        run: |
          # mtools reads the ESP the way the firmware does; openssl reads the
          # certificate osb stages for MOK.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mtools
          d="build/ubuntu/${{ matrix.image }}.x86_64/destdir"
          ls -l "$d"
          # The bmap has to describe the image exactly or flashing with bmaptool
          # would corrupt the disk: every range checksum matches the image, and
          # every block the bmap skips is zero.
          tools/check-bmap.py "$d/${{ matrix.image }}.img"
          # The signed chain has to be on the ESP itself, not merely installed in
          # the rootfs, and osb's certificate has to be there for MOK.
          tools/check-esp.sh "$d/${{ matrix.image }}.img" "${{ matrix.chain }}"
          if [ "${{ matrix.iso }}" = "true" ]; then
            # Hybrid boot, the installer payload, and prompts on a screen console.
            grep -aq 'EL TORITO SPECIFICATION' "$d/${{ matrix.image }}.iso"
            grep -aq 'osb.install=/osb/${{ matrix.image }}.img.gz' "$d/${{ matrix.image }}.iso"
            grep -aq 'console=tty0' "$d/${{ matrix.image }}.iso"
            echo "ISO boots on BIOS and UEFI and installs with prompts on screen"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image }}
          path: |
            build/ubuntu/${{ matrix.image }}.x86_64/destdir/${{ matrix.image }}.img
            build/ubuntu/${{ matrix.image }}.x86_64/destdir/${{ matrix.image }}.img.bmap
            build/ubuntu/${{ matrix.image }}.x86_64/destdir/${{ matrix.image }}.iso
            build/ubuntu/${{ matrix.image }}.x86_64/destdir/${{ matrix.image }}.sbom.json
          if-no-files-found: warn
          retention-days: 30
      - name: Collect build logs
        if: failure()
        run: |
          mkdir -p logs
          cd build && find . -name '*.log' -exec cp --parents {} "$GITHUB_WORKSPACE/logs" \; || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs-${{ matrix.image }}
          path: logs
          if-no-files-found: ignore
