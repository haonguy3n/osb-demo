name: build

# Builds the Ubuntu image and its installer ISO, and keeps them as artifacts for
# 30 days:
#
#   demo-image.img + .img.bmap   what you bmaptool onto an SSD or SD card
#   demo-image.iso               hybrid BIOS/UEFI installer for the same image
#   demo-image.sbom.json         the package list that went into it
#
# The image boots through the distro's own signed shim and GRUB, so it comes up
# under stock Secure Boot keys without enrolling anything.
#
# osb comes from its latest release; if there is no release yet it is built from
# source, so this works either way.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: ubuntu signed-shim
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install osb
        run: |
          url=https://github.com/haonguy3n/osb/releases/latest/download/osb-linux-amd64
          if curl -fsSL -o "$RUNNER_TEMP/osb" "$url"; then
            echo "using the latest osb release"
          else
            echo "no osb release available yet - building osb from source"
            git clone --depth 1 https://github.com/haonguy3n/osb.git "$RUNNER_TEMP/osb-src"
            (cd "$RUNNER_TEMP/osb-src" && go build -o "$RUNNER_TEMP/osb" ./cmd/osb)
          fi
          sudo install -m 0755 "$RUNNER_TEMP/osb" /usr/local/bin/osb
          osb version | tee "$RUNNER_TEMP/osb-version.txt"
      - name: Allow unprivileged user namespaces
        # osb builds every unit inside a bwrap sandbox, which needs
        # unprivileged user namespaces: Ubuntu 24.04 denies them by default
        # through AppArmor, and then every unit fails with "setting up uid map:
        # Permission denied".
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          unshare --user --map-root-user true
      - name: Cache key inputs
        id: key
        run: |
          echo "week=$(date +%Y-%V)" >> "$GITHUB_OUTPUT"
          echo "osb=$(tr -d '\n' < "$RUNNER_TEMP/osb-version.txt")" >> "$GITHUB_OUTPUT"
      - name: Cache osb's toolchain image
        # The toolchain image (compiler and distro tooling) is the most expensive
        # part of a from-scratch build. It holds the builder, not the target
        # packages, so a week-old one is fine.
        id: toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/osb-toolchains.tar.zst
          key: toolchain-${{ runner.arch }}-ubuntu-${{ steps.key.outputs.osb }}-${{ steps.key.outputs.week }}
      - name: Load the toolchain image
        if: steps.toolchain.outputs.cache-hit == 'true'
        run: |
          zstd -dc "$RUNNER_TEMP/osb-toolchains.tar.zst" | docker load \
            || echo "warning: cached toolchain image unusable; rebuilding"
      - name: Build the image and the ISO
        run: osb build demo-image -distro ubuntu -machine x86_64
      - name: Save the toolchain image for the cache
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          images=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep '^osb/toolchain' || true)
          [ -n "$images" ] || exit 0
          docker save $images | zstd -T0 -3 > "$RUNNER_TEMP/osb-toolchains.tar.zst"
      - name: Check the artifacts
        run: |
          d=build/ubuntu/demo-image.x86_64/destdir
          ls -l "$d"
          # The bmap has to describe the image exactly or flashing with bmaptool
          # would corrupt the disk: every range checksum matches the image, and
          # every block the bmap skips is zero.
          tools/check-bmap.py "$d/demo-image.img"
          # The distro's signed chain has to be on the ESP itself, not just
          # installed in the rootfs: shim as the boot file and our own grub.cfg
          # with the slot command line.
          read -r start size < <(sfdisk -d "$d/demo-image.img" | sed -n 's/.*img1 : start= *\([0-9]*\), size= *\([0-9]*\).*/\1 \2/p')
          esp() { dd if="$d/demo-image.img" bs=512 skip="$start" count="$size" status=none; }
          esp | grep -aq 'UEFI SHIM'
          esp | grep -aq 'osb.overlay=tmpfs'
          esp | grep -aq 'osb.slot='
          # Hybrid boot, the installer payload, and prompts on a screen console.
          grep -aq 'EL TORITO SPECIFICATION' "$d/demo-image.iso"
          grep -aq 'osb.install=/osb/demo-image.img.gz' "$d/demo-image.iso"
          grep -aq 'console=tty0' "$d/demo-image.iso"
          echo "image carries the signed shim chain; ISO installs with prompts on screen"
      - uses: actions/upload-artifact@v4
        with:
          name: demo-image-ubuntu
          path: |
            build/ubuntu/demo-image.x86_64/destdir/demo-image.img
            build/ubuntu/demo-image.x86_64/destdir/demo-image.img.bmap
            build/ubuntu/demo-image.x86_64/destdir/demo-image.iso
            build/ubuntu/demo-image.x86_64/destdir/demo-image.sbom.json
          retention-days: 30
      - name: Collect build logs
        if: failure()
        run: |
          mkdir -p logs
          cd build && find . -name '*.log' -exec cp --parents {} "$GITHUB_WORKSPACE/logs" \; || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: logs
          if-no-files-found: ignore
